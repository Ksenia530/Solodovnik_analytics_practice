openapi: 3.0.2
servers:
  - url: storetest/v3
info:
  version: 1.0.
  title: OpenAPI 3.0
  termsOfService: 'http://swagger.io/terms/'
tags:
  - name: user
    description: Everything about Users
  - name: order
    description: Everything about  Orders
  - name: product
    description: Everything about  Products
  - name: employee
    description: Everything about  Products
  - name: authentication
    description: System access rights
paths:
  '/orders/findByStatus?status=done':
    get:
      tags:
        - order
      summary: Get order information
      operationId: getOrder
      parameters:
        - name: orderId
          in: query
          description: order identifier
          required: true
          schema:
            type: integer
            format: int64    
      responses:
        '200':
          description: Successful request
          content:
            application/json:
              example:
                orderId: 1255125
                productName: updated_order
                productAmount: 515415
                status: done
        '401':
          description: Invalid ID supplied
      security:
        - api_key: []
  /user: 
    post:
      tags:
        - user
      summary: Create a new user
      operationId: CreateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Success
          content:
            application/json:
              example:
                name: new_user
                surname: new_userSurname
                number: new_number
                email: new_user@example.com
                numberDiscountCard: new_card
        '400':
          description: Invalid  value      
          content:
            application/json:
              example:
                code: 400
                message: Invalid  value   
      security:
        - oauth2: []
  /employees/{idEmployees}:
    patch:
      tags:
        - employee
      summary: Partially update employee information
      operationId: updated
      parameters:
        - name: EmployeesId
          in: path
          description: employee information
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Successful partial update
          content:
            application/json:
              example:
                EmployeesId: 26514
                number: 48415
        '400':
          description: Invalid  value      
          content:
            application/json:
              example:
                code: 400
                message: Invalid  value   
      security:
        - api_key: []
  /registration:
    post:
      tags:
        - authentication
      summary: Registation in system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Логин пользователя
                  example: Ksenia 
                surname:
                  type: string
                  description: user surname
                  example: Solodovnik
                e-mail:
                  type: string
                  format: password
                  example: test@uandex.com
                password:
                  type: string
                  format: password
                  description: Пароль пользователя
                number:
                  type: integer
                  description: user number
                  example: 8944587814
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                  access_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: 1eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgS
                  session_id:
                    type: string
                    description: session_id
                    example:  "12345"
                  expiration time:
                    type: string
                    description: time to life
                    example:  "124234149563"
        '401':
          description: Аuthentication error
        '500':
          description: Server rrror   
  /login:
    post:
      tags:
        - authentication
      summary: Login in system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                e-mail:
                  type: string
                  format: password
                  example: test@uandex.com
                password:
                  type: string
                  format: password
                  description: Пароль пользователя
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ
                  access_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: 1eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgS  
                  session_id:
                    type: string
                    description: session_id
                    example:  "12345"
                  expiration time:
                    type: string
                    description: time to life
                    example:  "124234149563"
        '401':
          description: Unauthorized
        '500':
          description: Server rrror
  /logout:
    post:
      tags:
        - authentication
      summary: Logout system
      parameters:
        - name: Authorization
          description: session_id
          in: header
          required: false
          schema:
            type: string
            example: 1554125
      responses:
        '200':
          description: Ok
        '401':
          description: Invalid ID supplied
      security:
        - bearerAuth: []   
  /recovery-password:
    post:
      tags:
        - authentication
      summary: Update password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  format: e-mail
                  example: test@yandex.com
      responses:
        '200':
          description: Ok
        '500':
          description: Server error
  /new-password:
    post:
      tags:
        - authentication
      summary: Create new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  format: password
                  example: test25254
                code:
                  type: string
                  format: code
                  example: 4444455
      responses:
        '200':
          description: Ok
        '403':
          description: Forbidden
        '500':
          description: Server error
  /refresh-token:
    post:
      tags:
        - authentication
      summary: Refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token :
                  type: string
                  format: refresh_token 
                  example: 1eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ
                  access_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: 1eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgS  
                  active:
                    type: boolean
                    description: token status
                    example:  "true"
                  expiration time:
                    type: string
                    description: time to life
                    example:  "85890"
        '403':
          description: Forbidden
        '500':
          description: Server error
      security:
        - bearerAuth: []  
  /who-i-am:   
    get:
      tags:
        - authentication
      summary: Get information about user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token :
                  type: string
                  format: refresh_token 
                  example: 1eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ
                  access_token:
                    type: string
                    description: Bearer Token для дальнейшей аутентификации
                    example: 1eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJPbmxpbmUgS  
                  e-mail:
                    type: string
                    description: user e-mail
                    example:  test@yandex.ru
                  name:
                    type: string
                    description: user name
                    example:  Ksenia
                  surname: 
                    type: string
                    description: user surname
                    example:  Solodovnik
                  number: 
                    type: string
                    description: user surname
                    example:  8911584584
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error    
      security:
        - bearerAuth: []  
  /products/{productId}:
    delete:
      tags:
        - product
      summary: Delete product
      operationId: deleteProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Success
        '404':
          description: Product not found
          content:
            application/json:
              example:
                code: 400
                message: Invalid  value  
components:
  schemas:
    Order:
      x-swagger-router-model: io.swagger.model.Order
      properties:
        orderId:
          type: integer
          format: int64
          example: 198772
        productName:
          type: string
          format: product name
          example: table
        productAmount:
          type: integer
          format: int64
          example: 5
        status:
          type: string
          format: istatus order
          example: done
    User:
      x-swagger-router-model: io.swagger.model.User
      properties:
        name:
          type: string
          example: Petr
        surname:
          type: string
          example: Petrov
        email:
          type: string
          example: test@email.com
        number:
          type: string
          example: 12345
        numberDiscountCard:
          type: integer
          format: int64
          example: 97427
    Employee:
      x-swagger-router-model: io.swagger.model.Employee
      properties:      
        number:  
          type: string
          example: 47313
    Product:
      x-swagger-router-model: io.swagger.model.Product
      properties:
        productId:
          type: integer
          format: int64
          example: 10
    Deliveries:
      x-swagger-router-model: io.swagger.model.Deliveries
      properties:
        nameOrganization:
          type: string
          format: string
          example: Express
        inn:
          type: integer
          format: int64
          example: 45541215       
  requestBodies:
    user:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Deliveries:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Deliveries'        
    order:
       content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
    Employee:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'    
  securitySchemes:
    auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: 'https://.swagger.io/oauth/authorize'
          scopes:
            'write': modify in your account
            'read': read your data
    api_key:
      type: apiKey
      name: api_key
      in: header          
    bearerAuth:            
      type: apiKey
      name: Authorization
      in: header
     
  
          
